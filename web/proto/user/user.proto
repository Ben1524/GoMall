syntax = "proto3";

package user;

option go_package = "./proto;user";

// 用户信息结构
message UserInfo {
  int64 id = 1;               // 用户ID
  string username = 2;        // 用户名
  string phone = 3;           // 手机号
  string email = 4;           // 邮箱
  string avatar = 5;          // 头像URL
  int32 status = 6;           // 状态(1:正常,0:禁用)
  string create_time = 7;     // 创建时间
  string update_time = 8;     // 更新时间
}


// token验证放在webAPI网关中处理

// 注册请求
message RegisterRequest {
  string username = 1;        // 用户名
  string password = 2;        // 密码
  string phone = 3;           // 手机号(可选)
  string email = 4;           // 邮箱
  string code = 5;            // 验证码
}

// 注册响应
message RegisterResponse {
  int32 code = 1;             // 状态码(0:成功,非0:失败)
  string message = 2;         // 提示信息
  UserInfo user = 3;          // 用户信息
}

// 登录请求
message LoginRequest {
  string email = 1;           // 邮箱
  string password = 2;        // 密码
}

// 登录响应
message LoginResponse {
  int32 code = 1;             // 状态码(0:成功,非0:失败)
  string message = 2;         // 提示信息
  UserInfo user = 4;          // 用户信息
}

// 获取用户信息请求
message GetUserRequest {
  int64 user_id = 1;          // 用户ID
}

// 获取用户信息响应
message GetUserResponse {
  int32 code = 1;             // 状态码(0:成功,非0:失败)
  string message = 2;         // 提示信息
  UserInfo user = 3;          // 用户信息
}

// 更新用户信息请求
message UpdateUserRequest {
  string phone = 1;           // 手机号(可选,为空则不更新)
  string email = 2;           // 邮箱(可选,为空则不更新)
  string avatar = 3;          // 头像URL(可选,为空则不更新)
}

// 更新用户信息响应
message UpdateUserResponse {
  int32 code = 1;             // 状态码(0:成功,非0:失败)
  string message = 2;         // 提示信息
  UserInfo user = 3;          // 更新后的用户信息
}

// 修改密码请求
message ChangePasswordRequest {
  string old_password = 1;    // 旧密码
  string new_password = 2;    // 新密码
}

// 修改密码响应
message ChangePasswordResponse {
  int32 code = 1;             // 状态码(0:成功,非0:失败)
  string message = 2;         // 提示信息
}

// 用户服务接口
service User {
  rpc Register(RegisterRequest) returns (RegisterResponse);       // 用户注册
  rpc Login(LoginRequest) returns (LoginResponse);                // 用户登录
  rpc GetUser(GetUserRequest) returns (GetUserResponse);          // 获取用户信息
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse); // 更新用户信息
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse); // 修改密码
}
