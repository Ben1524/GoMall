version: "3.8"

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      - CONFIG_PATH=/app/web/config.example.yaml
      - CONSUL_ADDR=consul:8500
    volumes:
      - ./docker-configs/web.yaml:/app/web/config.example.yaml:ro
    ports:
      - "8080:8080"
    networks:
      - gomall-net

  product:
    build:
      context: ./product
      dockerfile: Dockerfile
    environment:
      - CONFIG_PATH=/app/product/config.example.yaml
      - CONSUL_ADDR=consul:8500
